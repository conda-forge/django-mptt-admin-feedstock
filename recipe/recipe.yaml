# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.1"

package:
  name: django-mptt-admin
  version: ${{ version }}

source:
  url: https://github.com/mbraak/django-mptt-admin/archive/refs/tags/${{ version }}.tar.gz
  sha256: 93853a5386ecfa4abcaff68a40d2a7ec140c600b4022a2b321daea55b1b83841

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django-mptt

tests:
  - python:
      imports:
        - django_mptt_admin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mbraak/django-mptt-admin
  license: Apache-2.0
  license_file: LICENSE.rst
  summary: Django-mptt-admin provides a nice Django Admin interface for Mptt models
  description: Django-mptt-admin provides a nice Django Admin interface for django-mptt models.
  repository: https://github.com/mbraak/django-mptt-admin
  documentation: https://mbraak.github.io/django-mptt-admin/
extra:
  recipe-maintainers:
    - cshaley
    - sannykr
    - rxm7706
